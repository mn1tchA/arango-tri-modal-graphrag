version: "3.8"

services:
  arangodb:
    image: arangodb/arangodb:3.12.4
    container_name: arango_graphrag
    environment:
      - ARANGO_NO_AUTH=1
    ports:
      - "8529:8529"
    command: >
      arangod
      --server.endpoint tcp://0.0.0.0:8529
      --experimental-vector-index=true
    volumes:
      - arangodb_data:/var/lib/arangodb3

volumes:
  arangodb_data:
